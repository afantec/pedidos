<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Produtos</ui:define>

    <ui:define name="conteudo">
        <script>
            function previewImagemProduto(input) {
                var arquivo = input.files &amp;&amp; input.files[0];
                var img = input.closest(".campo").querySelector(".preview-imagem");
                if (!arquivo || !img) {
                    return;
                }
                var leitor = new FileReader();
                leitor.onload = function () {
                    img.src = leitor.result;
                    img.style.display = "block";
                };
                leitor.readAsDataURL(arquivo);
            }
            document.addEventListener("change", function (evento) {
                var input = evento.target;
                if (input &amp;&amp; input.type === "file" &amp;&amp; input.closest("#edicao")) {
                    previewImagemProduto(input);
                }
            });
        </script>
        <h1>Produtos</h1>

        <h:form id="lista">
            <div class="barra">
                <p:commandButton value="Novo produto" icon="pi pi-plus"
                                 action="#{produtoView.novo}" process="@this"
                                 update=":edicao" oncomplete="PF('dlgProduto').show()">
                    <p:resetInput target=":edicao"/>
                </p:commandButton>
            </div>

            <p:dataTable id="tabela" value="#{produtoView.produtos}" var="p" paginator="true" rows="15"
                         emptyMessage="Nenhum produto cadastrado." size="small" stripedRows="true">
                <p:column headerText="" style="width: 4rem">
                    <h:panelGroup rendered="#{p.imagemTipo != null}">
                        <img src="#{request.contextPath}/api/v1/produtos/#{p.id}/imagem?v=#{produtoView.imagemVersao}"
                             alt="" width="40" height="40" style="object-fit: cover; border-radius: 4px"/>
                    </h:panelGroup>
                </p:column>
                <p:column headerText="Código" sortBy="#{p.codigo}" filterBy="#{p.codigo}"
                          filterMatchMode="contains" style="width: 10rem">
                    #{p.codigo}
                </p:column>
                <p:column headerText="Descrição" sortBy="#{p.descricao}" filterBy="#{p.descricao}"
                          filterMatchMode="contains">
                    #{p.descricao}
                </p:column>
                <p:column headerText="Preço" sortBy="#{p.preco}" style="width: 9rem" styleClass="direita">
                    <h:outputText value="#{p.preco}">
                        <f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Situação" style="width: 7rem">
                    <p:tag value="#{p.ativo ? 'Ativo' : 'Inativo'}" severity="#{p.ativo ? 'success' : 'secondary'}"/>
                </p:column>
                <p:column style="width: 7rem" styleClass="direita">
                    <p:commandButton icon="pi pi-pencil" title="Editar" styleClass="rounded-button ui-button-flat"
                                     action="#{produtoView.editar(p)}" process="@this"
                                     update=":edicao" oncomplete="PF('dlgProduto').show()">
                        <p:resetInput target=":edicao"/>
                    </p:commandButton>
                    <p:commandButton icon="pi pi-trash" title="Excluir"
                                     styleClass="rounded-button ui-button-flat ui-button-danger"
                                     action="#{produtoView.excluir(p)}" process="@this" update="tabela">
                        <p:confirm header="Excluir produto" message="Excluir #{p.descricao}?" icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>

            <p:confirmDialog global="true" showEffect="fade">
                <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>
        </h:form>

        <p:dialog header="Produto" widgetVar="dlgProduto" modal="true" resizable="false" responsive="true">
            <h:form id="edicao" enctype="multipart/form-data">
                <p:messages closable="true"/>
                <div class="form-grid">
                    <div class="campo">
                        <p:outputLabel for="codigo" value="Código"/>
                        <p:inputText id="codigo" value="#{produtoView.edicao.codigo}" required="true" maxlength="30"/>
                    </div>
                    <div class="campo">
                        <p:outputLabel for="descricao" value="Descrição"/>
                        <p:inputText id="descricao" value="#{produtoView.edicao.descricao}" required="true" maxlength="200"/>
                    </div>
                    <div class="campo">
                        <p:outputLabel for="preco" value="Preço"/>
                        <p:inputNumber id="preco" widgetVar="precoProduto" value="#{produtoView.edicao.preco}"
                                       required="true" symbol="R$ " decimalSeparator="," decimalSeparatorAlternative="."
                                       thousandSeparator="" minValue="0" decimalPlaces="2" modifyValueOnWheel="false"/>
                    </div>
                    <div class="campo">
                        <p:outputLabel value="Imagem"/>
                        <p:fileUpload id="imagem" mode="simple" skinSimple="true" accept="image/*"
                                      value="#{produtoView.arquivo}" label="Escolher"/>
                        <img class="preview-imagem" alt=""
                             src="#{produtoView.temImagemEdicao ? request.contextPath.concat(produtoView.urlImagemEdicao) : 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}"
                             style="max-width: 12rem; max-height: 8rem; object-fit: contain; #{produtoView.temImagemEdicao ? '' : 'display: none'}"/>
                        <span style="font-size: .85rem; color: #6c757d">PNG, JPEG, WEBP ou GIF, até 2 MB. Sem arquivo novo, a imagem atual permanece.</span>
                    </div>
                    <div class="campo">
                        <p:selectBooleanCheckbox id="ativo" value="#{produtoView.edicao.ativo}" itemLabel="Ativo"/>
                    </div>
                </div>
                <div class="barra" style="justify-content: flex-end; margin-top: 1rem">
                    <p:commandButton value="Cancelar" type="button" styleClass="ui-button-flat"
                                     onclick="PF('dlgProduto').hide()"/>
                    <p:commandButton value="Salvar" icon="pi pi-check" action="#{produtoView.salvar}"
                                     process="@form" update="@form :lista:tabela"
                                     onstart="if (PF('precoProduto')) PF('precoProduto').copyValueToHiddenInput()"/>
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
