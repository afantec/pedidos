# Esteira CI/CD no GitHub Actions - integração contínua
#
# Pull request: test
# Push na main: test + package. O app.jar fica como artefato desta execução por 30 dias;
#               cada execução verde é uma versão que o painel da esteira pode implantar
#               (o deploy é o workflow deploy.yml, disparado pelo painel).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest      # tem Docker para o Testcontainers; não usa o servidor de produção
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --errors clean verify
      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  package:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --errors clean package -DskipTests
      - uses: actions/upload-artifact@v7
        with:
          name: app-jar                  # nome usado pelo deploy.yml
          path: target/app.jar
          retention-days: 30             # versões mais antigas não podem mais ser implantadas
          if-no-files-found: error

  # Deploy automático a cada push: só roda quando o cadastro do serviço no painel da esteira
  # está com "Implantar automaticamente" ligado (variável DEPLOY_AUTOMATICO=true do repositório).
  deploy-automatico:
    needs: package
    if: github.event_name == 'push' && vars.DEPLOY_AUTOMATICO == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write           # disparar o deploy.yml
    steps:
      - name: Dispara o deploy desta versão
        run: >-
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          -f acao=deploy -f versao="$GITHUB_RUN_ID" -f sha="$GITHUB_SHA" -f automatico=true
        env:
          GH_TOKEN: ${{ github.token }}
